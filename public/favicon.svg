<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
>
  <defs>
    <linearGradient
      id="gradient"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#38bdf8"
      />

      <stop
        offset="100%"
        stop-color="#8b5cf6"
      />
    </linearGradient>
  </defs>

  <rect
    width="64"
    height="64"
    rx="14"
    fill="#0b1120"
  />

  <rect
    x="2"
    y="2"
    width="60"
    height="60"
    rx="12"
    fill="none"
    stroke="url(#gradient)"
    stroke-width="3"
  />

  <text
    x="32"
    y="40"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="25"
    font-weight="700"
    fill="#38bdf8"
  >
    IA
  </text>
</svg>